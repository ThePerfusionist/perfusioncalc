name: perfusion_calc
description: >-
  PerfusionCalc - Bilingual (EN/DE) educational medical calculator for
  perfusionists, cardiac surgery students and clinical perfusion teams.
  Covers BSA, oxygen delivery, resistances, electrolytes, tube volumes,
  pediatric perfusion, Severinghaus BGA correction, and more. PDF export
  on every tab, offline-capable PWA, fully tested formulas with primary
  source citations. Not for clinical use.

publish_to: 'none'

version: 0.2.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # PDF-Export: erzeugt PDF-Dokumente direkt im Browser, native Dart-Lib.
  pdf: ^3.11.1
  # Native DOM-API fuer File-Download im Web (window.HTMLAnchorElement).
  web: any
  # Cross-Platform Save-Dialog: oeffnet auf Android das Storage Access
  # Framework, auf iOS die Files-App, und schreibt das PDF an den vom
  # Nutzer gewaehlten Speicherort. Selbe API, plattform-uebergreifend.
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note: The web/ folder (favicon.ico, favicon.png, icons/, manifest.json,
  # index.html) is automatically copied to build/web/ by `flutter build web`.
  # It must NOT be listed here — these are web assets, not Flutter runtime assets.
  assets:
    # icon.png ist NICHT gelistet: es wird zur Laufzeit nicht verwendet
    # (nur Quelle fuer die Launcher-/PWA-Icons) und wuerde sonst unnoetig
    # 451 KB ins Web-Bundle packen.
    - assets/o2_chart.png
    - assets/finck_va.jpg
    - assets/finck_vv.jpg
    - assets/heart_anterior.jpg
    - assets/heart_posterior.jpg
    - assets/heart_cross_section.jpg
    - assets/coronary_arteries.jpg
    # Roboto fuer PDF-Export (Standard-PDF-Schriften unterstuetzen kein Unicode)
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf
