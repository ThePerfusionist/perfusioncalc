name: perfusion_calc
description: >-
  PerfusionCalc - Bilingual (EN/DE) educational medical calculator for
  perfusionists, cardiac surgery students and clinical perfusion teams.
  Covers BSA, oxygen delivery, resistances, electrolytes, tube volumes,
  pediatric perfusion, Severinghaus BGA correction, and more. PDF export
  on every tab, offline-capable PWA, fully tested formulas with primary
  source citations. Not for clinical use.

publish_to: 'none'

version: 0.4.35+57

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # Scheduled local notifications for the cardioplegia re-dose reminder.
  # Needed because an in-app timer cannot fire while the app is backgrounded
  # or the screen is off - the OS has to deliver the alert.
  flutter_local_notifications: ^22.0.0
  # Required by flutter_local_notifications for zonedSchedule().
  timezone: ^0.11.0
  # PDF-Export: erzeugt PDF-Dokumente direkt im Browser, native Dart-Lib.
  pdf: ^3.11.1
  # Native DOM API for file download on the web (window.HTMLAnchorElement).
  web: ^1.1.0   # was "any": a fresh pub upgrade could otherwise jump across a breaking change
  # Cross-platform save dialog: opens the Storage Access Framework on
  # Android and the Files app on iOS, and writes the PDF to the location the
  # user chose. Same API on every platform.
  # v11: static methods instead of FilePicker.platform (the call site in
  # utils/pdf_download_stub.dart was adapted). The jump also brings a fix for
  # a path traversal vulnerability (CWE-22) when resolving paths from
  # external content providers.
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note: The web/ folder (favicon.ico, favicon.png, icons/, manifest.json,
  # index.html) is automatically copied to build/web/ by `flutter build web`.
  # It must NOT be listed here — these are web assets, not Flutter runtime assets.
  assets:
    # icon.png is NOT listed: it is not used at runtime (it is only the
    # source for the launcher/PWA icons) and would otherwise add 451 KB to
    # the web bundle for nothing.
    - assets/o2_chart.png
    - assets/finck_va.jpg
    - assets/finck_vv.jpg
    - assets/heart_anterior.jpg
    - assets/heart_posterior.jpg
    - assets/heart_cross_section.jpg
    - assets/coronary_arteries.jpg
    # Roboto for the PDF export (the standard PDF fonts have no Unicode
    # support). Must ALSO be listed under assets:, because pdf_export.dart
    # reads the files via rootBundle.load() — fonts: alone is not enough.
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf

  # The same files, additionally declared as the app's font family.
  #
  # Without this block CanvasKit loads its default font from
  # fonts.gstatic.com at runtime. That is a problem in three places:
  #   1. a stricter CSP blocks the request — the app then renders with no
  #      text at all (v0.4.2, see web/index.html)
  #   2. the offline Windows distribution has no internet by definition
  #   3. a hospital firewall can block fonts.gstatic.com
  # Bundled, the font is part of the build and none of the three cases
  # occurs. Cost: roughly 480 KB in the web bundle.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
