name: perfusion_calc
description: PerfusionCalc - Medical calculator for perfusionists

publish_to: 'none'

version: 0.1.9+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # PDF-Export: erzeugt PDF-Dokumente direkt im Browser, native Dart-Lib.
  pdf: ^3.11.1
  # Native DOM-API fuer File-Download im Web (window.HTMLAnchorElement).
  web: any
  # Cross-Platform PDF-Sharing/Printing - auf Android/iOS oeffnet das
  # System-Share-Sheet, damit der Nutzer das PDF speichern oder teilen kann.
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note: The web/ folder (favicon.ico, favicon.png, icons/, manifest.json,
  # index.html) is automatically copied to build/web/ by `flutter build web`.
  # It must NOT be listed here — these are web assets, not Flutter runtime assets.
  assets:
    - assets/icon.png
    - assets/o2_chart.png
    - assets/finck_va.jpg
    - assets/finck_vv.jpg
    - assets/heart_anterior.jpg
    - assets/heart_posterior.jpg
    - assets/heart_cross_section.jpg
    - assets/coronary_arteries.jpg
    # Roboto fuer PDF-Export (Standard-PDF-Schriften unterstuetzen kein Unicode)
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf
