name: perfusion_calc
description: >-
  PerfusionCalc - Bilingual (EN/DE) educational medical calculator for
  perfusionists, cardiac surgery students and clinical perfusion teams.
  Covers BSA, oxygen delivery, resistances, electrolytes, tube volumes,
  pediatric perfusion, Severinghaus BGA correction, and more. PDF export
  on every tab, offline-capable PWA, fully tested formulas with primary
  source citations. Not for clinical use.

publish_to: 'none'

version: 0.4.23+45

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # Scheduled local notifications for the cardioplegia re-dose reminder.
  # Needed because an in-app timer cannot fire while the app is backgrounded
  # or the screen is off - the OS has to deliver the alert.
  flutter_local_notifications: ^22.0.0
  # Required by flutter_local_notifications for zonedSchedule().
  timezone: ^0.11.0
  # PDF-Export: erzeugt PDF-Dokumente direkt im Browser, native Dart-Lib.
  pdf: ^3.11.1
  # Native DOM-API fuer File-Download im Web (window.HTMLAnchorElement).
  web: ^1.1.0   # war "any": ein frisches pub upgrade duerfte sonst ueber einen Breaking Change springen
  # Cross-Platform Save-Dialog: oeffnet auf Android das Storage Access
  # Framework, auf iOS die Files-App, und schreibt das PDF an den vom
  # Nutzer gewaehlten Speicherort. Selbe API, plattform-uebergreifend.
  # v11: statische Methoden statt FilePicker.platform (Aufrufstelle in
  # utils/pdf_download_stub.dart angepasst). Der Sprung bringt ausserdem
  # einen Fix fuer eine Path-Traversal-Schwachstelle (CWE-22) beim Aufloesen
  # von Pfaden aus externen Content-Providern.
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note: The web/ folder (favicon.ico, favicon.png, icons/, manifest.json,
  # index.html) is automatically copied to build/web/ by `flutter build web`.
  # It must NOT be listed here — these are web assets, not Flutter runtime assets.
  assets:
    # icon.png ist NICHT gelistet: es wird zur Laufzeit nicht verwendet
    # (nur Quelle fuer die Launcher-/PWA-Icons) und wuerde sonst unnoetig
    # 451 KB ins Web-Bundle packen.
    - assets/o2_chart.png
    - assets/finck_va.jpg
    - assets/finck_vv.jpg
    - assets/heart_anterior.jpg
    - assets/heart_posterior.jpg
    - assets/heart_cross_section.jpg
    - assets/coronary_arteries.jpg
    # Roboto fuer PDF-Export (Standard-PDF-Schriften unterstuetzen kein Unicode).
    # Muss AUSSERDEM unter assets: stehen, weil pdf_export.dart die Dateien
    # ueber rootBundle.load() liest - fonts: allein reicht dafuer nicht.
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf

  # Dieselben Dateien zusaetzlich als Schriftfamilie der App.
  #
  # Ohne diesen Block laedt CanvasKit seine Standardschrift zur Laufzeit von
  # fonts.gstatic.com. Das ist an drei Stellen ein Problem:
  #   1. eine strengere CSP sperrt den Abruf - die App rendert dann ganz ohne
  #      Text (v0.4.2, siehe web/index.html)
  #   2. die Offline-Windows-Distribution hat per Definition kein Internet
  #   3. eine Klinik-Firewall kann fonts.gstatic.com blockieren
  # Gebuendelt ist die Schrift Teil des Builds und keiner der drei Faelle
  # tritt ein. Kosten: rund 480 KB im Web-Bundle.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
