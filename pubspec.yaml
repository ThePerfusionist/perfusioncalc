name: perfusion_calc
description: PerfusionCalc - Medical calculator for perfusionists

publish_to: 'none'

version: 0.1.7+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/o2_chart.png
    - assets/finck_va.jpg
    - assets/finck_vv.jpg
    - assets/heart_anterior.png
    - assets/heart_posterior.png
    - assets/heart_cross_section.png
    - assets/coronary_arteries.svg
    - web/favicon.png
    - web/icons/
