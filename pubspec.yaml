name: perfusion_calc
description: PerfusionCalc - Medical calculator for perfusionists

publish_to: 'none'

version: 0.1.8+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  flutter_svg: ^2.0.10+1
  # Erforderlich fuer HtmlElementView mit nativen DOM-Bildern
  # (Web-Image-Workaround fuer Browser ohne WebGL).
  # Version-Constraint bewusst weit gefasst, damit Flutter SDK die
  # passende Version waehlt (sie ist via flutter SDK pinned).
  web: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note: The web/ folder (favicon.ico, favicon.png, icons/, manifest.json,
  # index.html) is automatically copied to build/web/ by `flutter build web`.
  # It must NOT be listed here — these are web assets, not Flutter runtime assets.
  assets:
    - assets/icon.png
    - assets/o2_chart.png
    - assets/finck_va.jpg
    - assets/finck_vv.jpg
    - assets/heart_anterior.jpg
    - assets/heart_posterior.jpg
    - assets/heart_cross_section.jpg
    - assets/coronary_arteries.svg
