<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter Web - PerfusionCalc
    The base href is replaced at build time by flutter build web --base-href
  -->
  <base href="/perfusioncalc/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PerfusionCalc – Medical calculator for perfusionists. Educational use only.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ═══ Favicon – mehrfach definiert für maximale Browser-Kompatibilität ═══ -->
  <!-- Standard favicon.ico (wird von allen Browsern erkannt) -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <!-- PNG Fallback -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <!-- ════════════════════════════════════════════════════════════════════════ -->

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PerfusionCalc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>PerfusionCalc</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    const serviceWorkerVersion = "1142562905" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              waitForActivation(reg.installing ?? reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              'Failed to load app from service worker. Falling back to plain <script> tag.',
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>
</html>
