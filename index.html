<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PerfusionCalc – Medical calculator for perfusionists. Educational use only.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ═══ Security Headers ═══ -->
  <!--
    CSP-Hinweise für den WASM/skwasm-Build:
      - 'wasm-unsafe-eval' ist zwingend, damit der Browser das WebAssembly-
        Modul (skwasm bzw. CanvasKit-Fallback) kompilieren darf.
      - worker-src 'self' blob: erlaubt den skwasm-Render-Worker.
      - child-src spiegelt worker-src für Browser, die worker-src (noch) nicht
        unterstützen (z. B. ältere Safari) und auf child-src zurückfallen.
      - Assets werden lokal ausgeliefert (--no-web-resources-cdn), daher ist
        gstatic.com nur noch als Fallback-Quelle für CanvasKit gelistet.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com;
    worker-src 'self' blob:;
    child-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    frame-ancestors 'none';
  ">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()">

  <!-- ═══ Favicon (v9) ═══ -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=9">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=9">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=9">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=9">

  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PerfusionCalc">
  <meta name="theme-color" content="#FFA500">

  <title>PerfusionCalc</title>
  <link rel="manifest" href="manifest.json?v=9">

  <!--
    ═══ Service Worker Registration (Offline-PWA) ═══
    Registriert unseren eigenen sw.js. Damit ist die App:
      - Offline nutzbar nach dem ersten Besuch
      - Installierbar als PWA (Android: "Zum Startbildschirm hinzufuegen",
        iOS Safari: Teilen-Knopf -> "Zum Home-Bildschirm", Desktop Chrome:
        Install-Icon in der Adressleiste)

    Hinweis zu Flutter's eigenem Service Worker:
    Flutter's flutter_bootstrap.js registriert automatisch einen eigenen
    Service Worker (flutter_service_worker.js), der allerdings deprecated
    ist und sich selbst bei Aktivierung wieder abmeldet. Unser sw.js hat
    einen anderen Dateinamen und Scope, stoert sich nicht daran.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      // Warten bis die Seite fertig geladen ist, damit SW-Installation
      // das initiale Laden nicht verlangsamt.
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function (reg) {
            // Optional: Auf Updates lauschen. Wenn ein neuer SW bereit ist,
            // koennten wir hier ein "Update verfuegbar"-Banner zeigen.
            // Fuer jetzt: automatisch uebernehmen.
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch(function (err) {
            console.warn('Service Worker registration failed:', err);
          });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
