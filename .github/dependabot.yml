version: 2

# The workflows are pinned to full commit SHAs (see audit 2.1: a movable tag
# such as @v2 runs in the same job as KEYSTORE_BASE64). Pinned SHAs do go
# stale, though — Dependabot keeps them current and carries the version
# comment behind the SHA along. Without this file the pin is a security gain
# plus maintenance debt; with it, only the security gain.

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

    # One PR per week instead of five: patch and minor updates to actions
    # are almost always uncritical and can be read together. Major jumps are
    # excluded below, so the group contains only harmless changes.
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

    # NO automatic major jumps.
    #
    # Block B deliberately pinned WITHIN the existing major version — pinning
    # and a major change do not belong in the same commit. Without this rule
    # Dependabot immediately proposed the opposite: checkout 6->7, setup-java
    # 4->5, gh-release 2->3 and upload-artifact 4->7 (three majors at once).
    #
    # These actions run in the same job as KEYSTORE_BASE64, or build the
    # artefact that ends up in the Play Store. A major change alters
    # behaviour there, not just version numbers — upload-artifact v5 for
    # identically named artefacts, for instance, or checkout v7 for the
    # runner's Node version. Such changes belong done one at a time, with a
    # test run behind them, sensibly together with the next bump of
    # FLUTTER_VERSION.
    #
    # The security purpose is fully preserved: within the major the SHAs are
    # still tracked automatically, and Dependabot alerts report security
    # updates independently of this rule.
    #
    # The rule has proven itself: the first checks.yml run reported "Node.js
    # 20 is deprecated", after which setup-node was raised to v5 on its own.
    # In v0.4.20 checkout v7, setup-java v5, upload-artifact v7 and
    # action-gh-release v3 followed — bundled, after each action had been
    # checked to confirm that every input in use still exists unchanged.
    # That is exactly how it should go: deliberately, together, with a test
    # run afterwards.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Dart/Flutter-Pakete ───────────────────────────────────────────────────
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

    # Here majors are deliberately NOT blocked across the board: for an app
    # with few, well-surveyable dependencies a major PR is a useful reminder.
    # Only the two packages whose major changes have historically cost a
    # release of their own are excluded.
    ignore:
      # The 18 -> 22 migration was a release of its own, including knock-on
      # defects in icon naming, R8 and desktop plugin registration.
      - dependency-name: "flutter_local_notifications"
        update-types: ["version-update:semver-major"]
      # Carries the entire PDF export; a major breaks the API there.
      - dependency-name: "pdf"
        update-types: ["version-update:semver-major"]
