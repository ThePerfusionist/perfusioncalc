# PerfusionCalc – Automatisches WebApp Deployment zu GitHub Pages
# Trigger: jeder Push zu main | manuell über Actions-Tab
# URL: https://perfusioncalc.de/

name: Deploy WebApp to GitHub Pages

on:
  push:
    branches:
      - main
    # Rebuild only when app-relevant files changed. Changes to README,
    # LICENSE or docs no longer trigger a build.
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Least privilege: peaceiris/actions-gh-pages pushes a commit to the
# gh-pages branch, that is all it needs. 'pages: write' and 'id-token: write'
# belong to the actions/deploy-pages route, which this workflow does not use.
permissions:
  contents: write

# Forces every JavaScript action in this workflow onto Node.js 24, even when
# the action itself still declares 'using: node20' in its action.yml (here
# that concerns peaceiris/actions-gh-pages@v4). This sidesteps the
# deprecation warning until the maintainer publishes a Node 24 release.
# GitHub makes Node 24 the default from 2026-06-02 anyway.
# Note: the warning in the "Complete job" step may persist — that is a known
# cosmetic bug (actions/runner#4295). The action does run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single source of truth for the toolchain. pubspec.lock requires
  # flutter >= 3.38.1 / dart >= 3.10.0 (raised by flutter_local_notifications
  # v21). Without an explicit pin the action installs whatever 'stable' is on
  # the day, so two builds of the same commit can see two toolchains.
  # Keep in sync with the other workflows AND with the local dev machines.
  FLUTTER_VERSION: '3.44.8'

# Prevents two deployments from overlapping when several pushes follow one
# another. New push → previous run cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Flutter & Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (flutter analyze)
        # Fails the build on analyzer errors. Warnings remain allowed so as
        # not to block progress.
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        # NO '|| echo' any more: perfusioncalc.de must not be deployed when
        # the calculation tests are red. A silent failure here would mean
        # that a regression the test suite has already caught is shipped to
        # clinical users regardless.
        run: flutter test

      - name: Build Flutter Web (WASM build, CanvasKit fallback)
        # --wasm enables the WebAssembly build: at runtime Flutter picks
        # skwasm when the browser supports WasmGC, otherwise CanvasKit (the
        # JS build). On many mobile browsers CanvasKit still applies — that
        # is fine as long as WebGL/GPU rendering is available (which is why
        # the COOP/COEP headers that had disabled WebGL were removed again).
        # --no-web-resources-cdn: engine assets served locally from our own
        # origin instead of gstatic.com (no external round trip, fully
        # offline capable).
        # --release: minification, tree shaking, dead code elimination.
        # --pwa-strategy=none is MANDATORY, not optional:
        # 'offline-first' makes Flutter generate its own
        # flutter_service_worker.js, which flutter_bootstrap.js registers at
        # start-up — in the same scope '/' as our web/sw.js. Two
        # registrations for one scope cannot coexist; the later one replaces
        # the earlier. Online this goes unnoticed because both serve from the
        # network; OFFLINE the app breaks (ERR_INTERNET_DISCONNECTED,
        # main.dart.js and canvaskit stay 'pending' because our just-evicted
        # worker never resolves its respondWith promises). Our sw.js handles
        # the caching entirely — Flutter needs no second worker for it.
        run: flutter build web --wasm --release --no-web-resources-cdn --base-href / --pwa-strategy=none

      # Two substitutions in the shipped sw.js:
      #
      #   BUILD_ID      ties the cache name to the commit (audit 4.1).
      #                 Without it the cache name never changes and users run
      #                 indefinitely on an old clinical build.
      #   BUILD_ASSETS  the complete precache list from build/web. Needed
      #                 BECAUSE the cache name depends on the commit: every
      #                 deployment creates an empty cache and the old one is
      #                 deleted in activate(). Anything not in the precache
      #                 that the already-loaded tab does not request again is
      #                 missing afterwards — that is exactly how main.dart.js
      #                 got lost offline.
      #
      # Both substitutions are verified and fail the job if they do not take
      # effect. A silent failure would be invisible and would reintroduce the
      # very defect this step fixes.
      - name: Stamp service worker build id and precache list
        run: |
          set -euo pipefail
          SW=build/web/sw.js
          test -f "$SW" || { echo "::error::$SW fehlt"; exit 1; }

          sed -i "s/const BUILD_ID = 'DEV';/const BUILD_ID = '${GITHUB_SHA}';/" "$SW"
          grep -q "const BUILD_ID = '${GITHUB_SHA}';" "$SW" || {
            echo "::error::BUILD_ID nicht ersetzt - Cache-Invalidierung waere wirkungslos."
            exit 1
          }

          python3 - "$SW" <<'PY'
          import json, os, sys

          sw_path = sys.argv[1]
          root = 'build/web'

          # Already in CORE_SHELL, there with ?v=9 — which is how the app
          # requests them. Without this exclusion they would sit in the cache
          # twice.
          skip_exact = {
              'sw.js', 'CNAME', 'index.html', 'manifest.json',
              'favicon.ico', 'favicon.png', 'apple-touch-icon.png',
          }

          # Files the browser NEVER requests. Without these exclusions the
          # precache sat at 45.5 MB while offline operation actually needed
          # 10.7 MB — every visitor would have downloaded four times the
          # amount on every deployment. On a clinical tablet over cellular
          # that matters.
          #
          #   .map / .symbols  debug artefacts for symbolising stack traces.
          #                    Flutter puts a .symbols file next to every
          #                    CanvasKit variant; none of them is loaded at
          #                    runtime.
          #   experimental_webparagraph/
          #                    experimental renderer variant, loaded only
          #                    with a flag set.
          #
          # The remaining renderer variants (canvaskit/, canvaskit/chromium/,
          # skwasm, skwasm_heavy, wimp) stay in DELIBERATELY: which one
          # applies is decided by the browser at runtime. Offline robustness
          # across browsers is worth more here than a few MB.
          skip_suffix = ('.map', '.symbols')
          skip_prefix = ('icons/', 'canvaskit/experimental_webparagraph/')

          assets = []
          sizes = {}
          total = 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  full = os.path.join(dirpath, name)
                  rel = os.path.relpath(full, root).replace(os.sep, '/')
                  if rel in skip_exact:
                      continue
                  if rel.startswith(skip_prefix) or rel.endswith(skip_suffix):
                      continue
                  size = os.path.getsize(full)
                  assets.append('./' + rel)
                  sizes['./' + rel] = size
                  total += size
          assets.sort()

          # Safeguard against an empty or half-finished build: without a
          # main bundle the precache would be worthless and offline broken
          # again.
          entry_points = [a for a in assets
                          if a.startswith('./main.dart.') or a == './flutter_bootstrap.js']
          if not entry_points:
              print('::error::Kein main.dart.*/flutter_bootstrap.js in build/web gefunden')
              sys.exit(1)

          src = open(sw_path, encoding='utf-8').read()
          placeholder = 'const BUILD_ASSETS = [];'
          if placeholder not in src:
              print('::error::Platzhalter BUILD_ASSETS nicht gefunden - sw.js geaendert?')
              sys.exit(1)

          body = ',\n'.join('  ' + json.dumps(a) for a in assets)
          src = src.replace(placeholder, 'const BUILD_ASSETS = [\n' + body + ',\n];', 1)
          open(sw_path, 'w', encoding='utf-8').write(src)

          print('Precache: %d Dateien, %.1f MB' % (len(assets), total / 1024 / 1024))
          for e in entry_points:
              print('  Entry point: ' + e)
          # Print the largest entries too: that makes it visible on the next
          # run, without measuring, where the weight goes should Flutter ship
          # new variants.
          print('  Groesste Eintraege:')
          for a in sorted(assets, key=lambda x: sizes[x], reverse=True)[:5]:
              print('    %7.1f MB  %s' % (sizes[a] / 1024 / 1024, a))
          PY

          grep -q "const BUILD_ASSETS = \[$" "$SW" || {
            echo "::error::BUILD_ASSETS nicht ersetzt - Precache waere leer."
            exit 1
          }
          echo "Service-Worker-Cache: perfusioncalc-pcalc-${GITHUB_SHA}"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          # The commit message on the gh-pages branch identifies the push
          # that triggered it. Deliberately ONLY the SHA:
          # github.event.head_commit.message is untrusted input and was
          # interpolated directly into an action input here (expression
          # injection, the standard finding of every actions scanner). The
          # SHA identifies the push unambiguously and cannot be influenced.
          commit_message: "Deploy ${{ github.sha }}"
          cname: perfusioncalc.de
