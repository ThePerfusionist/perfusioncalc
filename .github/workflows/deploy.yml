# PerfusionCalc – Automatisches WebApp Deployment zu GitHub Pages
# Trigger: jeder Push zu main | manuell über Actions-Tab
# URL: https://perfusioncalc.de/

name: Deploy WebApp to GitHub Pages

on:
  push:
    branches:
      - main
    # Nur neu bauen, wenn App-relevante Dateien geändert wurden.
    # Änderungen an README, LICENSE, oder docs triggern keinen Build mehr.
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Least privilege: peaceiris/actions-gh-pages pushes a commit to the
# gh-pages branch, that is all it needs. 'pages: write' and 'id-token: write'
# belong to the actions/deploy-pages route, which this workflow does not use.
permissions:
  contents: write

# Zwingt alle JavaScript-Actions in diesem Workflow auf Node.js 24, auch wenn
# die Action selbst noch 'using: node20' in ihrer action.yml deklariert
# (betrifft hier peaceiris/actions-gh-pages@v4). Damit umgehen wir die
# Deprecation-Warnung bis der Maintainer einen Node-24-Release veröffentlicht.
# GitHub macht Node 24 ab 02.06.2026 ohnehin zum Default.
# Hinweis: Die Warnung im "Complete job"-Schritt kann bestehen bleiben - das
# ist ein bekannter kosmetischer Bug (actions/runner#4295). Die Action läuft
# aber real auf Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single source of truth for the toolchain. pubspec.lock requires
  # flutter >= 3.38.1 / dart >= 3.10.0 (raised by flutter_local_notifications
  # v21). Without an explicit pin the action installs whatever 'stable' is on
  # the day, so two builds of the same commit can see two toolchains.
  # Keep in sync with the other workflows AND with the local dev machines.
  FLUTTER_VERSION: '3.44.8'

# Verhindert, dass sich zwei Deployments gleichzeitig überlagern, wenn
# mehrere Pushes hintereinander passieren. Neuer Push → alter Run abgebrochen.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Flutter & Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (flutter analyze)
        # Bricht den Build ab, wenn Analyzer-Fehler im Code sind.
        # Warnings bleiben erlaubt, um dich nicht zu blockieren.
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        # KEIN '|| echo' mehr: perfusioncalc.de darf nicht deployed werden,
        # wenn die Rechen-Tests rot sind. Ein stiller Fehlschlag hier hiesse,
        # dass eine Regression, die die Testsuite bereits erkannt hat,
        # trotzdem an klinische Nutzer ausgeliefert wird.
        run: flutter test

      - name: Build Flutter Web (WASM build, CanvasKit fallback)
        # --wasm aktiviert den WebAssembly-Build: Flutter wählt zur Laufzeit
        # skwasm, wenn der Browser WasmGC unterstützt, sonst CanvasKit (JS-Build).
        # Auf vielen mobilen Browsern greift weiterhin CanvasKit - das ist okay,
        # solange WebGL/GPU-Rendering verfügbar ist (deshalb wurden die COOP/COEP-
        # Header wieder entfernt, die WebGL deaktiviert hatten).
        # --no-web-resources-cdn: Engine-Assets lokal vom eigenen Origin statt
        # gstatic.com (kein externer Roundtrip, voll offline-fähig).
        # --release: Minification, Tree-Shaking, Dead-Code-Elimination.
        # --pwa-strategy=none ist ZWINGEND und nicht optional:
        # 'offline-first' laesst Flutter ein eigenes flutter_service_worker.js
        # erzeugen, das flutter_bootstrap.js beim Start registriert - im
        # selben Scope '/' wie unser web/sw.js. Zwei Registrierungen fuer
        # einen Scope koennen nicht koexistieren, die spaetere ersetzt die
        # fruehere. Online faellt das nicht auf, weil beide aus dem Netz
        # liefern; OFFLINE bricht die App ab (ERR_INTERNET_DISCONNECTED,
        # main.dart.js und canvaskit bleiben 'pending', weil unser gerade
        # verdraengter Worker seine respondWith-Promises nie aufloest).
        # Unser sw.js uebernimmt das Caching vollstaendig - Flutter braucht
        # dafuer keinen zweiten Worker.
        run: flutter build web --wasm --release --no-web-resources-cdn --base-href / --pwa-strategy=none

      # Zwei Ersetzungen im ausgelieferten sw.js:
      #
      #   BUILD_ID      koppelt den Cache-Namen an den Commit (Audit 4.1).
      #                 Ohne ihn aendert sich der Cache-Name nie und Nutzer
      #                 laufen unbegrenzt auf einem alten klinischen Build.
      #   BUILD_ASSETS  die vollstaendige Precache-Liste aus build/web.
      #                 Noetig, WEIL der Cache-Name am Commit haengt: jeder
      #                 Deploy legt einen leeren Cache an, der alte wird in
      #                 activate() geloescht. Was nicht im Precache steht und
      #                 vom bereits geladenen Tab nicht erneut angefragt
      #                 wird, fehlt danach - genau so ist main.dart.js
      #                 offline verloren gegangen.
      #
      # Beide Ersetzungen werden geprueft und brechen den Job ab, wenn sie
      # nicht greifen. Ein stilles Fehlschlagen waere unsichtbar und wuerde
      # den Fehler wieder einfuehren, den dieser Schritt behebt.
      - name: Stamp service worker build id and precache list
        run: |
          set -euo pipefail
          SW=build/web/sw.js
          test -f "$SW" || { echo "::error::$SW fehlt"; exit 1; }

          sed -i "s/const BUILD_ID = 'DEV';/const BUILD_ID = '${GITHUB_SHA}';/" "$SW"
          grep -q "const BUILD_ID = '${GITHUB_SHA}';" "$SW" || {
            echo "::error::BUILD_ID nicht ersetzt - Cache-Invalidierung waere wirkungslos."
            exit 1
          }

          python3 - "$SW" <<'PY'
          import json, os, sys

          sw_path = sys.argv[1]
          root = 'build/web'

          # Bereits in CORE_SHELL, dort mit ?v=9 - so fragt die App sie auch
          # an. Ohne diesen Ausschluss laegen sie doppelt im Cache.
          skip_exact = {
              'sw.js', 'CNAME', 'index.html', 'manifest.json',
              'favicon.ico', 'favicon.png', 'apple-touch-icon.png',
          }

          # Dateien, die der Browser NIE anfragt. Ohne diese Ausschluesse lag
          # der Precache bei 45,5 MB, waehrend der Offline-Betrieb tatsaechlich
          # 10,7 MB brauchte - jeder Besucher haette bei jedem Deploy das
          # Vierfache geladen. Auf einem Klinik-Tablet ueber Mobilfunk zaehlt
          # das.
          #
          #   .map / .symbols  Debug-Artefakte zum Entschluesseln von
          #                    Stacktraces. Flutter legt neben jede
          #                    CanvasKit-Variante eine .symbols-Datei; zur
          #                    Laufzeit wird keine davon geladen.
          #   experimental_webparagraph/
          #                    experimentelle Renderer-Variante, wird nur mit
          #                    gesetztem Flag geladen.
          #
          # Die uebrigen Renderer-Varianten (canvaskit/, canvaskit/chromium/,
          # skwasm, skwasm_heavy, wimp) bleiben BEWUSST drin: welche greift,
          # entscheidet erst der Browser zur Laufzeit. Offline-Robustheit ueber
          # verschiedene Browser hinweg ist hier mehr wert als ein paar MB.
          skip_suffix = ('.map', '.symbols')
          skip_prefix = ('icons/', 'canvaskit/experimental_webparagraph/')

          assets = []
          sizes = {}
          total = 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  full = os.path.join(dirpath, name)
                  rel = os.path.relpath(full, root).replace(os.sep, '/')
                  if rel in skip_exact:
                      continue
                  if rel.startswith(skip_prefix) or rel.endswith(skip_suffix):
                      continue
                  size = os.path.getsize(full)
                  assets.append('./' + rel)
                  sizes['./' + rel] = size
                  total += size
          assets.sort()

          # Sicherung gegen einen leeren oder halben Build: ohne ein
          # Haupt-Bundle waere der Precache wertlos und offline erneut kaputt.
          entry_points = [a for a in assets
                          if a.startswith('./main.dart.') or a == './flutter_bootstrap.js']
          if not entry_points:
              print('::error::Kein main.dart.*/flutter_bootstrap.js in build/web gefunden')
              sys.exit(1)

          src = open(sw_path, encoding='utf-8').read()
          placeholder = 'const BUILD_ASSETS = [];'
          if placeholder not in src:
              print('::error::Platzhalter BUILD_ASSETS nicht gefunden - sw.js geaendert?')
              sys.exit(1)

          body = ',\n'.join('  ' + json.dumps(a) for a in assets)
          src = src.replace(placeholder, 'const BUILD_ASSETS = [\n' + body + ',\n];', 1)
          open(sw_path, 'w', encoding='utf-8').write(src)

          print('Precache: %d Dateien, %.1f MB' % (len(assets), total / 1024 / 1024))
          for e in entry_points:
              print('  Entry point: ' + e)
          # Die groessten Brocken mit ausgeben: so ist beim naechsten Lauf ohne
          # Nachmessen sichtbar, wohin das Gewicht geht, falls Flutter neue
          # Varianten mitliefert.
          print('  Groesste Eintraege:')
          for a in sorted(assets, key=lambda x: sizes[x], reverse=True)[:5]:
              print('    %7.1f MB  %s' % (sizes[a] / 1024 / 1024, a))
          PY

          grep -q "const BUILD_ASSETS = \[$" "$SW" || {
            echo "::error::BUILD_ASSETS nicht ersetzt - Precache waere leer."
            exit 1
          }
          echo "Service-Worker-Cache: perfusioncalc-pcalc-${GITHUB_SHA}"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          # Commit-Message im gh-pages-Branch identifiziert den auslösenden Push.
          # Bewusst NUR die SHA: github.event.head_commit.message ist nicht
          # vertrauenswuerdiger Input und wurde hier direkt in eine Action-
          # Eingabe interpoliert (Expression Injection, Standardbefund jedes
          # Actions-Scanners). Die SHA identifiziert den Push eindeutig und
          # ist nicht beeinflussbar.
          commit_message: "Deploy ${{ github.sha }}"
          cname: perfusioncalc.de
