# PerfusionCalc – Automatischer Android-Release
#
# TRIGGER: Ein annotierter Git-Tag mit dem Muster "v*" auf main.
#   git tag -a v0.2.1 -m "Release v0.2.1"
#   git push origin v0.2.1
#
# ERGEBNIS: GitHub-Release mit APK als Download-Asset.
#   Dateiname: PerfusionCalc-v0.2.1.apk
#   Release-Notes: automatisch aus Commits seit dem letzten Tag.
#
# SIGNIERUNG (optional):
#   Ohne Secrets → APK wird debug-signed (installierbar, kein Play Store).
#   Mit Secrets  → APK wird release-signed (Play Store tauglich).
#   Secrets im Repo unter Settings → Secrets and variables → Actions anlegen:
#     KEYSTORE_BASE64   – base64-kodierter JKS-Keystore
#                         (openssl base64 -in release.keystore | tr -d '\n')
#     KEY_ALIAS         – Alias des Schlüssels im Keystore
#     KEY_PASSWORD      – Passwort des privaten Schlüssels
#     STORE_PASSWORD    – Passwort des Keystores

name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Für das Erstellen von GitHub-Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Code auschecken ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Vollständige History für Changelog-Generierung

      # ── 2. Java (für Android-Build nötig) ────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart versions
        run: flutter --version

      # ── 4. Dependencies & Analyse ─────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # ── 5. Signing-Keystore vorbereiten (optional) ────────────────────
      # Wenn KEYSTORE_BASE64 als Secret hinterlegt ist, wird der Keystore
      # dekodiert und key.properties angelegt. Fehlt das Secret, bleibt es
      # beim debug-Signing (Gradle-Fallback in android/app/build.gradle.kts).
      - name: Decode keystore & write key.properties (wenn Secret vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore-Secret gefunden – release-signing wird konfiguriert."
            # Zeilenumbrüche und Leerzeichen entfernen, die beim Einfügen
            # ins GitHub-Secret mitgenommen werden können, dann dekodieren.
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release.keystore
            # Prüfen, ob die Keystore-Datei valide ist (>0 Bytes)
            if [ ! -s android/app/release.keystore ]; then
              echo "FEHLER: Keystore-Datei ist leer – KEYSTORE_BASE64 prüfen."
              exit 1
            fi
            echo "Keystore dekodiert ($(wc -c < android/app/release.keystore) Bytes)."
            cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.keystore
          EOF
            echo "key.properties geschrieben."
          else
            echo "Kein KEYSTORE_BASE64-Secret gefunden – APK wird debug-signed."
          fi

      # ── 6. APK bauen ──────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── 7. APK umbenennen (Tag-Version in Dateinamen) ─────────────────
      - name: Rename APK with version
        run: |
          VERSION="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "PerfusionCalc-${VERSION}.apk"
          echo "APK_PATH=PerfusionCalc-${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── 8. GitHub-Release erstellen + APK hochladen ───────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PerfusionCalc ${{ env.VERSION }}"
          # Automatischer Changelog aus Commits seit dem letzten Tag.
          # Für angepasste Release-Notes: draft: true setzen und manuell
          # bearbeiten, bevor der Release veröffentlicht wird.
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
          # Tag-Nachricht (aus `git tag -a ... -m "..."`) als Intro.
          body: |
            ## Download

            | File | Description |
            |-------|-------------|
            | `PerfusionCalc-${{ env.VERSION }}.apk` | Android-App (direct install) |

            ### Installation
            1. APK download
            2. At the Android-Device: **Settings → Security → Unkown Sources** activate
            3. Open APK and install

            > **⚠️ Disclaimer** This application is intended only for educational and personal use. 
            >It is not validated for clinical use and must not be used for medical diagnosis, treatment decisions, or patient management. 
            >No guarantee of accuracy. Always verify results with primary sources and qualified professionals.