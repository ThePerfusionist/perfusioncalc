# PerfusionCalc – Automatischer Android-Release
#
# TRIGGER: Ein annotierter Git-Tag mit dem Muster "v*" auf main.
#   git tag -a v0.2.1 -m "Release v0.2.1"
#   git push origin v0.2.1
#
# ERGEBNIS: GitHub-Release mit APK (Direktinstall) UND AAB (Play Store) als Assets.
#   APK-Dateiname:  PerfusionCalc-v0.2.1.apk
#   AAB-Dateiname:  PerfusionCalc-v0.2.1.aab
#   Release-Notes:  automatisch aus Commits seit dem letzten Tag.
#
# SIGNIERUNG:
#   Ohne Secrets → APK/AAB wird debug-signed (nicht Play-Store-tauglich).
#   Mit Secrets  → APK/AAB wird release-signed (Play Store tauglich).
#   Secrets im Repo unter Settings → Secrets and variables → Actions anlegen:
#     KEYSTORE_BASE64   – base64-kodierter JKS-Keystore
#                         (openssl base64 -in release.keystore | tr -d '\n')
#     KEY_ALIAS         – Alias des Schlüssels im Keystore
#     KEY_PASSWORD      – Passwort des privaten Schlüssels
#     STORE_PASSWORD    – Passwort des Keystores

name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Für das Erstellen von GitHub-Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build APK + AAB & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Code auschecken ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Vollständige History für Changelog-Generierung

      # ── 2. Java (für Android-Build nötig) ────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart versions
        run: flutter --version

      # ── 4. Dependencies & Analyse ─────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # ── 5. Signing-Keystore vorbereiten (optional) ────────────────────
      # Wenn KEYSTORE_BASE64 als Secret hinterlegt ist, wird der Keystore
      # dekodiert und key.properties angelegt. Fehlt das Secret, bleibt es
      # beim debug-Signing (Gradle-Fallback in android/app/build.gradle.kts).
      - name: Decode keystore & write key.properties (wenn Secret vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore-Secret gefunden – release-signing wird konfiguriert."
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release.keystore
            if [ ! -s android/app/release.keystore ]; then
              echo "FEHLER: Keystore-Datei ist leer – KEYSTORE_BASE64 prüfen."
              exit 1
            fi
            echo "Keystore dekodiert ($(wc -c < android/app/release.keystore) Bytes)."
            cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.keystore
          EOF
            echo "key.properties geschrieben."
          else
            echo "Kein KEYSTORE_BASE64-Secret gefunden – APK/AAB wird debug-signed."
          fi

      # ── 6. APK bauen (für Direktinstall / Sideloading) ────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── 7. AAB bauen (für Google Play Store) ──────────────────────────
      - name: Build release AAB
        run: flutter build appbundle --release

      # ── 8. Offline-Webapp für Windows-PCs ohne Internet ───────────────
      # Bewusst im selben Job wie APK/AAB: ein zweiter Workflow, der
      # parallel dasselbe Release anlegen will, ist ein Wettlauf – dabei
      # ging das Paket verloren. Ein Job, ein Release, alle Dateien.
      #
      # --no-web-resources-cdn ist für den Offline-Betrieb zwingend, sonst
      # lädt die App CanvasKit von einem CDN und bleibt ohne Internet leer.
      - name: Build offline web app
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href / \
            --pwa-strategy offline-first

      - name: Assemble offline Windows bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/web
          cp -r build/web/. bundle/web/

          # Portablen Webserver beilegen (Apache-2.0). Die Download-URL wird
          # aus dem Release-Feed gelesen statt fest verdrahtet.
          CADDY_URL=$(curl -sSL https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | grep -o 'https://[^"]*windows_amd64\.zip' | head -1)
          if [ -z "$CADDY_URL" ]; then
            echo "::error::Keine Caddy-Windows-Download-URL gefunden"
            exit 1
          fi
          echo "Caddy: $CADDY_URL"
          curl -sSL "$CADDY_URL" -o caddy.zip
          unzip -o -j caddy.zip caddy.exe -d bundle/
          unzip -o -j caddy.zip LICENSE -d bundle/ || true
          if [ -f bundle/LICENSE ]; then mv bundle/LICENSE bundle/LICENSE-caddy.txt; fi

          cp tool/offline/start.bat  bundle/
          cp tool/offline/serve.ps1  bundle/
          cp tool/offline/LIESMICH.txt bundle/
          cp OFFLINE_WINDOWS.md bundle/

          test -f bundle/caddy.exe   || { echo "::error::caddy.exe fehlt"; exit 1; }
          test -f bundle/web/index.html || { echo "::error::Web-Build fehlt"; exit 1; }

      # ── 9. Artefakte umbenennen (Tag-Version in Dateinamen) ───────────
      - name: Rename artifacts with version
        run: |
          VERSION="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "PerfusionCalc-${VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "PerfusionCalc-${VERSION}.aab"
          (cd bundle && zip -rq "../PerfusionCalc-Offline-Windows-${VERSION}.zip" .)
          echo "APK_PATH=PerfusionCalc-${VERSION}.apk" >> $GITHUB_ENV
          echo "AAB_PATH=PerfusionCalc-${VERSION}.aab" >> $GITHUB_ENV
          echo "OFFLINE_PATH=PerfusionCalc-Offline-Windows-${VERSION}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── 10. GitHub-Release erstellen + alle Artefakte hochladen ───────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PerfusionCalc ${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
            ${{ env.OFFLINE_PATH }}
          body: |
            ## Download

            | File | Description |
            |-------|-------------|
            | `PerfusionCalc-${{ env.VERSION }}.apk` | Android-App (Direktinstall / Sideloading) |
            | `PerfusionCalc-${{ env.VERSION }}.aab` | Android App Bundle (Google Play Store Upload) |
            | `PerfusionCalc-Offline-Windows-${{ env.VERSION }}.zip` | Webapp für Windows-PCs **ohne Internetzugang** |

            ### Installation
            1. APK download
            2. At the Android-Device: **Settings → Security → Unkown Sources** activate
            3. Open APK and install

            > **⚠️ Disclaimer** This application is intended only for educational and personal use.
            > It is not validated for clinical use and must not be used for medical diagnosis, treatment decisions, or patient management.
            > No guarantee of accuracy. Always verify results with primary sources and qualified professionals.