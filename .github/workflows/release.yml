# PerfusionCalc – automated Android release
#
# TRIGGER: an annotated git tag matching "v*" on main.
#   git tag -a v0.2.1 -m "Release v0.2.1"
#   git push origin v0.2.1
#
# RESULT: a GitHub release with the APK (direct install) AND the AAB (Play
# Store) as assets.
#   APK file name:  PerfusionCalc-v0.2.1.apk
#   AAB file name:  PerfusionCalc-v0.2.1.aab
#   Release notes:  generated from the commits since the previous tag.
#
# SIGNING:
#   This workflow REQUIRES release signing. If KEYSTORE_BASE64 is missing the
#   job aborts immediately rather than quietly publishing debug-signed
#   artefacts under a release name (Play rejects those, but a sideloadable
#   APK looks genuine). The Gradle fallback to the debug key therefore only
#   applies to local builds without key.properties.
#   Create the secrets under Settings → Secrets and variables → Actions:
#     KEYSTORE_BASE64   – base64-encoded JKS keystore
#                         (openssl base64 -in release.keystore | tr -d '\n')
#     KEY_ALIAS         – alias of the key inside the keystore
#     KEY_PASSWORD      – password of the private key
#     STORE_PASSWORD    – password of the keystore

name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Für das Erstellen von GitHub-Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # See deploy.yml — the toolchain is pinned so that building the same tag
  # twice yields the same result. For a clinical app the question "which
  # toolchain built this APK" has to be answerable.
  FLUTTER_VERSION: '3.44.8'
  # Evaluated by android/app/build.gradle.kts: no silent fallback to the
  # debug key in a release build.
  PERFUSIONCALC_REQUIRE_RELEASE_SIGNING: 'true'

jobs:
  build-and-release:
    name: Build APK + AAB & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Code auschecken ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Vollständige History für Changelog-Generierung

      # ── 2. Java (für Android-Build nötig) ────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Flutter & Dart versions
        run: flutter --version

      # ── 4. Dependencies & Analyse ─────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # ── 5. Prepare the signing keystore ───────────────────────────────
      # KEYSTORE_BASE64 is mandatory: a release tag must not produce
      # debug-signed artefacts. If the secret is missing the job aborts here,
      # before anything is built.
      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt. Ein Release-Tag ohne Signaturschlüssel würde debug-signierte Artefakte erzeugen – Abbruch."
            exit 1
          fi
          echo "Keystore-Secret gefunden – release-signing wird konfiguriert."
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "FEHLER: Keystore-Datei ist leer – KEYSTORE_BASE64 prüfen."
            exit 1
          fi
          echo "Keystore dekodiert ($(wc -c < android/app/release.keystore) Bytes)."
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.keystore
          EOF
          echo "key.properties geschrieben."

      # ── 6. APK bauen (für Direktinstall / Sideloading) ────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── 7. AAB bauen (für Google Play Store) ──────────────────────────
      - name: Build release AAB
        run: flutter build appbundle --release

      # ── 8. Offline web app for Windows PCs without internet ───────────
      # Deliberately in the same job as APK/AAB: a second workflow trying to
      # create the same release in parallel is a race — and the package got
      # lost that way. One job, one release, all files.
      #
      # --no-web-resources-cdn is mandatory for offline operation, otherwise
      # the app loads CanvasKit from a CDN and stays blank without internet.
      - name: Build offline web app
        run: |
          # --pwa-strategy=none is MANDATORY, not optional:
          # 'offline-first' makes Flutter generate its own
          # flutter_service_worker.js, which flutter_bootstrap.js registers at
          # start-up — in the same scope '/' as our web/sw.js. Two
          # registrations for one scope cannot coexist; the later one replaces
          # the earlier. Online this goes unnoticed because both serve from the
          # network; OFFLINE the app breaks (ERR_INTERNET_DISCONNECTED,
          # main.dart.js and canvaskit stay 'pending' because our just-evicted
          # worker never resolves its respondWith promises). Our sw.js handles
          # the caching entirely — Flutter needs no second worker for it.
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href / \
            --pwa-strategy=none

      # Two substitutions in the shipped sw.js:
      #
      #   BUILD_ID      ties the cache name to the commit (audit 4.1).
      #                 Without it the cache name never changes and users run
      #                 indefinitely on an old clinical build.
      #   BUILD_ASSETS  the complete precache list from build/web. Needed
      #                 BECAUSE the cache name depends on the commit: every
      #                 deployment creates an empty cache and the old one is
      #                 deleted in activate(). Anything not in the precache
      #                 that the already-loaded tab does not request again is
      #                 missing afterwards — that is exactly how main.dart.js
      #                 got lost offline.
      #
      # Both substitutions are verified and fail the job if they do not take
      # effect. A silent failure would be invisible and would reintroduce the
      # very defect this step fixes.
      - name: Stamp service worker build id and precache list
        run: |
          set -euo pipefail
          SW=build/web/sw.js
          test -f "$SW" || { echo "::error::$SW fehlt"; exit 1; }

          sed -i "s/const BUILD_ID = 'DEV';/const BUILD_ID = '${GITHUB_SHA}';/" "$SW"
          grep -q "const BUILD_ID = '${GITHUB_SHA}';" "$SW" || {
            echo "::error::BUILD_ID nicht ersetzt - Cache-Invalidierung waere wirkungslos."
            exit 1
          }

          python3 - "$SW" <<'PY'
          import json, os, sys

          sw_path = sys.argv[1]
          root = 'build/web'

          # Already in CORE_SHELL, there with ?v=9 — which is how the app
          # requests them. Without this exclusion they would sit in the cache
          # twice.
          skip_exact = {
              'sw.js', 'CNAME', 'index.html', 'manifest.json',
              'favicon.ico', 'favicon.png', 'apple-touch-icon.png',
          }

          # Files the browser NEVER requests. Without these exclusions the
          # precache sat at 45.5 MB while offline operation actually needed
          # 10.7 MB — every visitor would have downloaded four times the
          # amount on every deployment. On a clinical tablet over cellular
          # that matters.
          #
          #   .map / .symbols  debug artefacts for symbolising stack traces.
          #                    Flutter puts a .symbols file next to every
          #                    CanvasKit variant; none of them is loaded at
          #                    runtime.
          #   experimental_webparagraph/
          #                    experimental renderer variant, loaded only
          #                    with a flag set.
          #
          # The remaining renderer variants (canvaskit/, canvaskit/chromium/,
          # skwasm, skwasm_heavy, wimp) stay in DELIBERATELY: which one
          # applies is decided by the browser at runtime. Offline robustness
          # across browsers is worth more here than a few MB.
          skip_suffix = ('.map', '.symbols')
          skip_prefix = ('icons/', 'canvaskit/experimental_webparagraph/')

          assets = []
          sizes = {}
          total = 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  full = os.path.join(dirpath, name)
                  rel = os.path.relpath(full, root).replace(os.sep, '/')
                  if rel in skip_exact:
                      continue
                  if rel.startswith(skip_prefix) or rel.endswith(skip_suffix):
                      continue
                  size = os.path.getsize(full)
                  assets.append('./' + rel)
                  sizes['./' + rel] = size
                  total += size
          assets.sort()

          # Safeguard against an empty or half-finished build: without a
          # main bundle the precache would be worthless and offline broken
          # again.
          entry_points = [a for a in assets
                          if a.startswith('./main.dart.') or a == './flutter_bootstrap.js']
          if not entry_points:
              print('::error::Kein main.dart.*/flutter_bootstrap.js in build/web gefunden')
              sys.exit(1)

          src = open(sw_path, encoding='utf-8').read()
          placeholder = 'const BUILD_ASSETS = [];'
          if placeholder not in src:
              print('::error::Platzhalter BUILD_ASSETS nicht gefunden - sw.js geaendert?')
              sys.exit(1)

          body = ',\n'.join('  ' + json.dumps(a) for a in assets)
          src = src.replace(placeholder, 'const BUILD_ASSETS = [\n' + body + ',\n];', 1)
          open(sw_path, 'w', encoding='utf-8').write(src)

          print('Precache: %d Dateien, %.1f MB' % (len(assets), total / 1024 / 1024))
          for e in entry_points:
              print('  Entry point: ' + e)
          # Print the largest entries too: that makes it visible on the next
          # run, without measuring, where the weight goes should Flutter ship
          # new variants.
          print('  Groesste Eintraege:')
          for a in sorted(assets, key=lambda x: sizes[x], reverse=True)[:5]:
              print('    %7.1f MB  %s' % (sizes[a] / 1024 / 1024, a))
          PY

          grep -q "const BUILD_ASSETS = \[$" "$SW" || {
            echo "::error::BUILD_ASSETS nicht ersetzt - Precache waere leer."
            exit 1
          }
          echo "Service-Worker-Cache: perfusioncalc-pcalc-${GITHUB_SHA}"

      - name: Assemble offline Windows bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/web
          cp -r build/web/. bundle/web/

          # Ship a portable web server (Apache-2.0). Version AND hash are
          # pinned: this caddy.exe is distributed to clinical workstations
          # under our release name. Without a pin the build is not
          # reproducible (two builds of the same tag can contain different
          # binaries) and a delivered bundle cannot be verified afterwards.
          # The SHA-512 comes from caddy_${CADDY_VERSION}_checksums.txt of
          # the official release and can be checked against it there.
          # When raising the version: change version and hash together, hash
          # from
          # https://github.com/caddyserver/caddy/releases/download/v<V>/caddy_<V>_checksums.txt
          CADDY_VERSION="2.11.4"
          CADDY_SHA512="cd5ccfd86a4b40732cf715890d0dca5bf3f63adefec5a7914de85adf240c60ce7e5d2791631b88ef9758e46b23bb1730e020b9c5d696889740b284ffd4788e35"
          CADDY_URL="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_windows_amd64.zip"
          echo "Caddy: $CADDY_URL"
          curl -sSLf "$CADDY_URL" -o caddy.zip
          echo "${CADDY_SHA512}  caddy.zip" | sha512sum -c -
          unzip -o -j caddy.zip caddy.exe -d bundle/
          unzip -o -j caddy.zip LICENSE -d bundle/ || true
          if [ -f bundle/LICENSE ]; then mv bundle/LICENSE bundle/LICENSE-caddy.txt; fi

          cp tool/offline/start.bat  bundle/
          cp tool/offline/serve.ps1  bundle/
          cp tool/offline/LIESMICH.txt bundle/
          cp OFFLINE_WINDOWS.md bundle/

          test -f bundle/caddy.exe   || { echo "::error::caddy.exe fehlt"; exit 1; }
          test -f bundle/web/index.html || { echo "::error::Web-Build fehlt"; exit 1; }

      # ── 9. Artefakte umbenennen (Tag-Version in Dateinamen) ───────────
      - name: Rename artifacts with version
        run: |
          VERSION="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "PerfusionCalc-${VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "PerfusionCalc-${VERSION}.aab"
          (cd bundle && zip -rq "../PerfusionCalc-Offline-Windows-${VERSION}.zip" .)
          echo "APK_PATH=PerfusionCalc-${VERSION}.apk" >> $GITHUB_ENV
          echo "AAB_PATH=PerfusionCalc-${VERSION}.aab" >> $GITHUB_ENV
          echo "OFFLINE_PATH=PerfusionCalc-Offline-Windows-${VERSION}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── 10. GitHub-Release erstellen + alle Artefakte hochladen ───────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "PerfusionCalc ${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
            ${{ env.OFFLINE_PATH }}
          body: |
            ## Download

            | File | Description |
            |-------|-------------|
            | `PerfusionCalc-${{ env.VERSION }}.apk` | Android-App (Direktinstall / Sideloading) |
            | `PerfusionCalc-${{ env.VERSION }}.aab` | Android App Bundle (Google Play Store Upload) |
            | `PerfusionCalc-Offline-Windows-${{ env.VERSION }}.zip` | Webapp für Windows-PCs **ohne Internetzugang** |

            ### Installation
            1. Download the APK
            2. On the Android device, enable **Settings → Security → Unknown sources**
            3. Open the APK and install it

            > **⚠️ Disclaimer** This application is intended only for educational and personal use.
            > It is not validated for clinical use and must not be used for medical diagnosis, treatment decisions, or patient management.
            > No guarantee of accuracy. Always verify results with primary sources and qualified professionals.

      # ── 11. Remove signing material from the runner workspace ─────────
      # Nothing of it is currently uploaded as an artefact, so the risk is
      # latent. The step is cheap insurance against a later workflow change
      # that accidentally collects the workspace directory. 'if: always()' —
      # the failure case is precisely the one where cleaning up matters.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/release.keystore
          echo "Signing material removed from workspace."
