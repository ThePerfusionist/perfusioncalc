name: Checks

# Runs on every push and every pull request to main.
#
# Why separate from deploy.yml: these checks should also run when nothing is
# deployed — on a branch, in a PR, in a fork. deploy.yml remains the delivery
# path and is not touched here.
#
# Two levels:
#   1. flutter analyze + flutter test   — what Dart itself can check
#   2. consistency_check.py             — what holds across language borders:
#      Dart against YAML, Dart against JavaScript, code against
#      documentation. Every check there stands for a defect that has already
#      occurred in this codebase (see PROJECT_STATE.md § 7).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match deploy.yml, release.yml, offline-bundle.yml and the
  # development machines.
  FLUTTER_VERSION: '3.44.8'

jobs:
  checks:
    name: Analyse, Tests, Konsistenz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      # Node is needed only for `node --check web/sw.js`. Without Node the
      # checker skips that single check with a warning — here it should run,
      # because the service worker carries the offline operation.
      #
      # v5, not v4: the first run of this workflow reported "Node.js 20 is
      # deprecated ... actions/setup-node@... are being forced to run on
      # Node.js 24". setup-node v4 itself runs on Node 20; v5 targets
      # Node 24. Dependabot does not catch this, because majors for actions
      # are deliberately ignored (see dependabot.yml) — such jumps belong
      # done individually and with a test run, which is exactly what this is.
      #
      # node-version 22: the current LTS. Node is used solely for
      # `node --check web/sw.js`; the version is uncritical for that, but it
      # should not itself be outdated.
      - name: Setup Node (für die sw.js-Syntaxprüfung)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install PyYAML (für die Workflow-Prüfung)
        run: python3 -m pip install --quiet pyyaml

      - name: Repository consistency
        run: python3 tool/verify/consistency_check.py

      # Informational, does NOT fail the run. A threshold would be
      # premature here: the screens deliberately have no widget tests, and a
      # number one has to reach invites tests that merely tick off lines.
      # The report makes gaps visible — a human has to decide.
      - name: Coverage (informativ)
        run: |
          flutter test --coverage
          python3 tool/verify/coverage_report.py
