<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter Web - PerfusionCalc
    Modern Flutter 3.22+ bootstrap.
    The base href is replaced at build time by flutter build web --base-href
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PerfusionCalc – Medical calculator for perfusionists. Educational use only.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ═══ Security Headers ═══════════════════════════════════════════════════ -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    frame-ancestors 'none';
  ">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()">

  <!-- ═══ Favicon – PerfusionCalc logo (multiple formats for max compatibility) ═══ -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=4">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=4">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png?v=4">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=4">

  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PerfusionCalc">

  <!-- Theme color matches app accent -->
  <meta name="theme-color" content="#FFA500">

  <title>PerfusionCalc</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pre-bootstrap: aggressively unregister any old service workers
       from previous deployments. This eliminates favicon-caching issues. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function(names) {
          names.forEach(function(n) {
            if (n.indexOf('flutter') !== -1) caches.delete(n);
          });
        });
      }
    }
  </script>
</head>
<body>
  <!-- Modern Flutter 3.22+ bootstrap – custom flutter_bootstrap.js disables SW -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
