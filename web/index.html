  <!-- Pre-bootstrap: aggressively unregister any old service workers
       from previous deployments. This eliminates favicon-caching issues. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function(names) {
          names.forEach(function(n) {
            if (n.indexOf('flutter') !== -1) caches.delete(n);
          });
        });
      }
    }
