<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PerfusionCalc – Medical calculator for perfusionists. Educational use only.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ═══ Security Headers ═══ -->
  <!--
    CSP-Hinweise für den WASM-Build:
      - 'wasm-unsafe-eval' ist zwingend, damit der Browser das WebAssembly-
        Modul (skwasm bzw. CanvasKit-Fallback) kompilieren darf.
      - worker-src 'self' blob: erlaubt den skwasm-Render-Worker.
      - child-src spiegelt worker-src für Browser, die worker-src (noch) nicht
        unterstützen (z. B. ältere Safari) und auf child-src zurückfallen.
      - fonts.gstatic.com in font-src UND connect-src ist ZWINGEND, solange
        CanvasKit seine Standardschrift zur Laufzeit nachlädt.
        --no-web-resources-cdn holt nur canvaskit.js/.wasm lokal, NICHT die
        Roboto-Schrift. Wird die Quelle gesperrt, rendert die App vollständig
        OHNE TEXT: Layout, Karten und Material-Icons (gebündeltes Asset)
        erscheinen, jede Beschriftung fehlt. Genau das ist mit v0.4.2
        passiert - der Auditbefund 2.6 hatte die Einträge für ungenutzt
        gehalten.
        Zusätzlich ist Roboto seit v0.4.3 als Schriftfamilie mitgebündelt
        (pubspec fonts:), damit die Anwendung ohne diesen Abruf auskommt -
        Voraussetzung für die Offline-Windows-Distribution. Die CSP-Einträge
        bleiben trotzdem als Rückfallweg stehen; einen zweiten stummen
        Textausfall ist das nicht wert.
      - www.gstatic.com in script-src ist dagegen tatsächlich entbehrlich:
        CanvasKit selbst kommt durch --no-web-resources-cdn vom eigenen
        Origin. Bleibt entfernt.
  -->
  <!--
    Welche Security-Header als <meta> überhaupt wirken:

      Content-Security-Policy   ja, per http-equiv
      X-Content-Type-Options    NEIN - nur als echter HTTP-Header
      Permissions-Policy        NEIN - nur als echter HTTP-Header
      X-Frame-Options           NEIN - nur als echter HTTP-Header
      frame-ancestors           NEIN - in <meta> per Spezifikation ignoriert
      referrer                  ja, als <meta name="referrer">

    Die drei wirkungslosen Tags standen hier und suggerierten Schutz, den es
    nicht gab (Audit 2.6) - entfernt. GitHub Pages kann keine HTTP-Header
    setzen; wer sie wirklich braucht, muss einen Reverse-Proxy oder ein CDN
    davorsetzen. Für den Offline-Windows-Bundle liesse sich das in der
    Caddyfile nachrüsten.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' https://fonts.gstatic.com;
    worker-src 'self' blob:;
    child-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- ═══ Favicon (v9) ═══ -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=9">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=9">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=9">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=9">

  <!-- iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PerfusionCalc">
  <meta name="theme-color" content="#FFA500">

  <title>PerfusionCalc</title>
  <link rel="manifest" href="manifest.json?v=9">

  <!-- Bootstrap früh laden lassen (Browser darf vorab fetchen) -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!--
    ═══ Leichtgewichtiger CSS-Splash ═══
    Reines HTML/CSS (kein JS, kein Bild-Decode-Overhead), erscheint sofort
    beim Laden und überbrückt die Zeit, bis die WASM-Engine gestartet ist und
    Flutter das erste Frame rendert. Verbessert die *gefühlte* Ladezeit
    spürbar - der Nutzer sieht statt eines leeren Bildschirms sofort das
    Branding. Flutter entfernt beim ersten Frame automatisch den Inhalt von
    <body>, daher verschwindet der Splash ohne zusätzliches JS.
  -->
  <style>
    #pc-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #2C2C2C;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      transition: opacity 0.3s ease;
    }
    #pc-splash .pc-title {
      color: #FFA500; font-size: 22px; font-weight: 600;
      letter-spacing: 0.5px; margin-top: 18px;
    }
    #pc-splash .pc-spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid rgba(255,165,0,0.25);
      border-top-color: #FFA500;
      animation: pc-spin 0.8s linear infinite;
    }
    @keyframes pc-spin { to { transform: rotate(360deg); } }
  </style>


  <!--
    ═══ Service Worker Registration (Offline-PWA) ═══
    Registriert unseren eigenen sw.js. Der SW macht die App offline-fähig und
    als PWA installierbar (App-Shell-Precache + stale-while-revalidate).

    HINWEIS: Die früher hier vorhandene Cross-Origin-Isolation (COOP/COEP +
    automatischer Reload) wurde entfernt. Ein Performance-Trace zeigte, dass die
    COI-Header WebGL deaktivierten und CanvasKit dadurch auf langsames CPU-
    Rendering zurückfiel. GPU-Rendering ist auf Smartphones der größere Hebel.

    Flutters eigener Service Worker: Der Hinweis, der früher hier stand
    ("stört sich nicht daran"), war falsch. Ein Service Worker wird pro SCOPE
    registriert, nicht pro Dateiname. flutter_service_worker.js und unser
    sw.js beanspruchen beide '/' - die spätere Registrierung ersetzt die
    frühere. Online fällt das nicht auf, weil beide aus dem Netz liefern;
    offline bricht die App ab. Deshalb wird jetzt mit --pwa-strategy=none
    gebaut: Flutter erzeugt gar keinen eigenen Worker mehr.

    Der Aufräumblock unten entfernt eine bereits vorhandene Registrierung von
    flutter_service_worker.js bei Nutzern, die eine ältere Fassung geöffnet
    hatten. Ohne ihn bliebe deren Browser auf dem falschen Worker stehen,
    weil unser sw.js sich nicht selbst an dessen Stelle setzen kann.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      // Einmalige Migration: alte Registrierung von Flutters Worker lösen.
      // Bewusst NUR diese eine - alles andere würde unseren eigenen Worker
      // gleich wieder mit abräumen.
      function dropFlutterServiceWorker() {
        if (!navigator.serviceWorker.getRegistrations) return Promise.resolve();
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) {
            var worker = reg.active || reg.waiting || reg.installing;
            if (worker && worker.scriptURL.indexOf('flutter_service_worker.js') !== -1) {
              return reg.unregister();
            }
            return null;
          }));
        }).catch(function () { /* nicht kritisch */ });
      }

      window.addEventListener('load', function () {
        dropFlutterServiceWorker().then(function () {
        return navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function (reg) {
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  nw.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch(function (err) {
            console.warn('Service Worker registration failed:', err);
          });
        });
      });
    })();
  </script>
</head>
<body>
  <!-- CSS-Splash: wird von Flutter beim ersten Frame automatisch ersetzt. -->
  <div id="pc-splash">
    <div class="pc-spinner"></div>
    <div class="pc-title">PerfusionCalc</div>
  </div>
  <script>
    // Entfernt den CSS-Splash zuverlässig, sobald Flutter sein erstes
    // Render-Element (<flutter-view> / <flt-glass-pane>) in den DOM hängt.
    // Versionsunabhängig über MutationObserver, mit Sicherheits-Timeout.
    (function () {
      function removeSplash() {
        var s = document.getElementById('pc-splash');
        if (!s) return;
        s.style.opacity = '0';
        setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 350);
      }
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
          removeSplash();
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // Fallback: spätestens nach 8 s entfernen, falls die Selektoren sich
      // in einer künftigen Flutter-Version ändern.
      setTimeout(removeSplash, 8000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
