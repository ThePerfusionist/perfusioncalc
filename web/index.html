<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PerfusionCalc – Medical calculator for perfusionists. Educational use only.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ═══ Security Headers ═══ -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    frame-ancestors 'none';
  ">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()">

  <!--
    ═══ FAVICON – clean, standards-compliant setup ═══
    Strategy:
      • New filename suffix (v8) on a fresh filename (pcalc-icon-v8) completely
        sidesteps Chrome's favicon.db, which caches by URL.
      • Query string (?v=8) on the classic /favicon.* paths forces revalidation
        for any user who already loaded the old ones.
      • Higher resolutions (192, 180) help modern browsers / iOS home-screen.
      • Order matters: list the icon you want the browser to PREFER last.
  -->

  <!-- Classic fallbacks (kept for legacy browsers / direct hits on /favicon.ico) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=8">

  <!-- Fresh filename: bypasses every existing cache on Chrome/Edge/Firefox -->
  <link rel="icon" type="image/x-icon" href="pcalc-icon-v8.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="pcalc-icon-v8.png">
  <link rel="icon" type="image/png" sizes="192x192" href="pcalc-icon-v8-192.png">

  <!-- Apple touch icon (iOS home screen & Safari) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">

  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PerfusionCalc">
  <meta name="theme-color" content="#FFA500">

  <title>PerfusionCalc</title>
  <link rel="manifest" href="manifest.json?v=8">

  <!--
    ═══ One-time cleanup script ═══
    Unregisters any old service worker + clears Flutter caches from earlier
    deployments. This ensures the browser re-fetches the icon files instead
    of using a cached copy of the old (pre-fix) Flutter defaults.
    Runs once per client; has no effect on subsequent visits.
  -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (names) {
            names.forEach(function (n) {
              if (n.indexOf('flutter') !== -1) caches.delete(n);
            });
          }).catch(function () {});
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
