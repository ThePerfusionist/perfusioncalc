# Analyzer configuration for PerfusionCalc.
#
# Baseline: flutter_lints. On top of that a deliberately small set of
# additions - each one caught a real defect in this codebase, none of them is
# style preference:
#
#   strict-casts          would have flagged the `as String` / `as IconData`
#                         casts that came from typing the tab list as
#                         List<Map<String, dynamic>>
#   avoid_dynamic_calls   same root cause, from the other direction
#   unawaited_futures     a dropped Future made a try/catch in
#                         CardioplegiaAlarmSettings._save catch nothing
#   use_build_context_synchronously
#                         the single most common source of crashes in a
#                         codebase with this many awaits inside widgets
#
# NOT enabled: strict-raw-types. It fires on legitimate third-party
# signatures (pdf/widgets, flutter_local_notifications) and would drown the
# useful findings.
#
# CI runs `flutter analyze --no-fatal-warnings`, so a new lint informs
# without blocking a release. Local target remains zero issues before a tag.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
    - prefer_final_locals
    - use_build_context_synchronously
